name: Validate portfolio
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf
      - run: python scripts/test_cv_html.py
      - run: python scripts/test_sync_cv.py
      - run: python scripts/test_validate_site.py
      - run: python research/validate_site.py
